<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home | Compass</title>
<link rel="icon" href="https://greekschoolmentone-vic.compass.education/Assets/Pix/favicon_v11855.png">

<style>
body{
    font-family:Arial, sans-serif;
    background:#111;
    color:#eee;
}

a{
    display:block;
    color:#6cf;
    padding:3px;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

.chatroom-link{
    color:#111 !important;
    background:#ffdc00;
    font-weight:bold;
    padding:10px;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>Game Index</h1>

<input type="text" id="searchInput" placeholder="Search games..." onkeyup="searchGames()">
<div id="links"></div>

<script>
async function loadFiles() {
    const res = await fetch("filenames.txt");
    const text = await res.text();

    const lines = text.split(/\r?\n/);
    const container = document.getElementById("links");

    lines.forEach(file => {
        file = file.trim();
        if (!file) return;

        if (
            file.toLowerCase().endsWith(".html") ||
            file.toLowerCase().endsWith(".htm")
        ) {
            const a = document.createElement("a");
            a.href = file;

            // Remove extension
            let display = file.replace(/\.(html|htm)$/i, "");

            // Remove "cl" from front only
            display = display.replace(/^cl/i, "");

            a.textContent = display;

            if (file.toLowerCase() === "chatroom.html") {
                a.className = "chatroom-link";
            }

            container.appendChild(a);
        }
    });
}

function searchGames() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const links = document.querySelectorAll("#links a");

    links.forEach(link => {
        link.style.display =
            link.textContent.toLowerCase().includes(input)
            ? "block"
            : "none";
    });
}

loadFiles();
</script>

</body>
</html>
