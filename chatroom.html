<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Compass</title>
  <link rel="icon" href="https://greekschoolmentone-vic.compass.education/Assets/Pix/favicon_v11855.png">
  <style>
    body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; background: #000; color: #00ff00; }

    #chat-container {
      width: 90vw;
      height: 80vh;
      border: 2px solid #00ff00;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 5px 0;
      padding: 5px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 1em;
    }

    .me {
      color: #ffff00;
      align-self: flex-end;
      text-align: right;
    }

    .other {
      color: #00ff00;
      align-self: flex-start;
      text-align: left;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #00ff00;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
    }

    #send {
      padding: 10px;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #000;
      padding: 20px;
      border: 2px solid #00ff00;
      width: 300px;
      text-align: center;
      color: #00ff00;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
    }

    .timestamp {
      font-size: 0.8em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="send">Send</button>
  </div>
</div>

<div id="username-modal" class="modal">
  <div class="modal-content">
    <h3>Enter your username</h3>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="submit-btn" id="submit-username">Submit</button>
    <button class="cancel-btn" id="cancel-username">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://chat-860a5-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let username = localStorage.getItem('chatUsername');
  if (!username) {
    username = prompt('Enter your username for the chat:');
    if (username && username.trim()) {
      localStorage.setItem('chatUsername', username.trim());
    } else {
      username = "User" + Math.floor(Math.random() * 1000);
    }
  }

  function addMessage(text, sender, timestamp, isMe) {
    const msg = document.createElement('div');
    msg.classList.add('message', isMe ? 'me' : 'other');
    const timeStr = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
    msg.innerHTML = `<span class="timestamp">[${timeStr}]</span> ${sender}: ${text}`;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  sendBtn.onclick = () => {
    const text = input.value.trim();
    if (!text) return;

    db.ref('messages').push({
      name: username,
      text: text,
      timestamp: Date.now()
    });

    input.value = '';
  };

  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendBtn.click();
  });

  db.ref('messages').on('child_added', snapshot => {
    const msg = snapshot.val();
    addMessage(msg.text, msg.name, msg.timestamp || Date.now(), msg.name === username);
  });
</script>

</body>
</html>
