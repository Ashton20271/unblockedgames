<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatroom</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }

    #chat-container {
      width: 80vw;
      height: 80vh;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 8px;
      max-width: 80%;
    }

    .me {
      background: #007bff;
      color: white;
      align-self: flex-end;
      text-align: right;
    }

    .other {
      background: #e5e5ea;
      color: black;
      align-self: flex-start;
      text-align: left;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    #send {
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fefefe;
      padding: 20px;
      border: 1px solid #888;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .modal-content button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-content .submit-btn {
      background: #007bff;
      color: white;
    }

    .modal-content .cancel-btn {
      background: #ccc;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="send">Send</button>
  </div>
</div>

<div id="username-modal" class="modal">
  <div class="modal-content">
    <h3>Enter your username</h3>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="submit-btn" id="submit-username">Submit</button>
    <button class="cancel-btn" id="cancel-username">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://chat-860a5-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const chatBox = document.getElementById('chat-box');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  let username = localStorage.getItem('chatUsername');
  if (!username) {
    username = prompt('Enter your username for the chat:');
    if (username && username.trim()) {
      localStorage.setItem('chatUsername', username.trim());
    } else {
      username = "User" + Math.floor(Math.random() * 1000);
    }
  }

  function addMessage(text, sender, isMe) {
    const msg = document.createElement('div');
    msg.classList.add('message', isMe ? 'me' : 'other');
    msg.innerText = sender + ': ' + text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  sendBtn.onclick = () => {
    const text = input.value.trim();
    if (!text) return;

    db.ref('messages').push({
      name: username,
      text: text
    });

    input.value = '';
  };

  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendBtn.click();
  });

  db.ref('messages').on('child_added', snapshot => {
    const msg = snapshot.val();
    addMessage(msg.text, msg.name, msg.name === username);
  });
</script>

</body>
</html>
