<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Compass</title>
  <link rel="icon" href="https://greekschoolmentone-vic.compass.education/Assets/Pix/favicon_v11855.png">
  <style>
    body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; background: #000; color: #00ff00; }

    #chat-container {
      width: 90vw;
      height: 80vh;
      border: 2px solid #00ff00;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 5px 0;
      padding: 5px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 1em;
    }

    .me {
      color: #ffff00;
      align-self: flex-end;
      text-align: right;
    }

    .other {
      color: #00ff00;
      align-self: flex-start;
      text-align: left;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #00ff00;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
    }

    #send {
      padding: 10px;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #000;
      padding: 20px;
      border: 2px solid #00ff00;
      width: 300px;
      text-align: center;
      color: #00ff00;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
    }

    .timestamp {
      font-size: 0.8em;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="typing-indicator" style="min-height: 1.2em; padding: 6px; color: #00ff00; font-size: 0.9em; opacity: 0.85;"></div>
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="file-input" type="file" style="display: none;" />
    <button id="file-btn" style="margin-right:8px; padding: 10px; border: 1px solid #00ff00; background: #000; color: #00ff00; cursor: pointer; font-family: 'Courier New', monospace;">+</button>
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="send">Send</button>
  </div>
</div>

<div id="username-modal" class="modal">
  <div class="modal-content">
    <h3>Enter your username</h3>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="submit-btn" id="submit-username">Submit</button>
    <button class="cancel-btn" id="cancel-username">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://chat-860a5-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const chatBox = document.getElementById('chat-box');
const typingIndicator = document.getElementById('typing-indicator');
const input = document.getElementById('input');
const fileInput = document.getElementById('file-input');
const sendBtn = document.getElementById('send');
const fileBtn = document.getElementById('file-btn');

const typingRef = db.ref('typing');
let typingTimeout = null;
const TYPING_TIMEOUT = 2000; // ms (indicator clears after 2 seconds of inactivity)

fileBtn.addEventListener('click', () => {
  fileInput.click();
});

let username = localStorage.getItem('chatUsername');
if (!username) {
  username = prompt('Enter your username for the chat:');
  if (username && username.trim()) {
    localStorage.setItem('chatUsername', username.trim());
  } else {
    username = "User" + Math.floor(Math.random() * 1000);
  }
}

function formatFileMessage(fileDataURL, fileName, fileType) {
  if (!fileDataURL || !fileName) return '';

  const safeName = fileName.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  if (fileType && fileType.startsWith('image/')) {
    return `<div style="margin-top:4px;"><span>Image: ${safeName}</span><br/><img src="${fileDataURL}" alt="${safeName}" style="max-width:200px;max-height:200px;margin-top:4px;border:1px solid #00ff00;"/></div>`;
  }

  return `<a href="${fileDataURL}" download="${safeName}">Download ${safeName}</a>`;
}

function addMessage(text, sender, timestamp, isMe, fileDataURL, fileName, fileType) {
  const msg = document.createElement('div');
  msg.classList.add('message', isMe ? 'me' : 'other');
  const timeStr = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});

  let html = `<span class="timestamp">[${timeStr}]</span> ${sender}:`;
  if (text && text.trim()) {
    const safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const urlRegex = /((https?:\/\/)[\w\-\._~:\/?#\[\]@!$&'()*+,;=%]+)/gi;
    const linkifiedText = safeText.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    html += ` ${linkifiedText}`;
  }

  if (fileDataURL) {
    html += ` ${formatFileMessage(fileDataURL, fileName, fileType)}`;
  }

  msg.innerHTML = html;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.onclick = async () => {
  const text = input.value.trim();
  if (!text) {
    setTypingState(false);
    return;
  }

  await db.ref('messages').push({
    name: username,
    text: text,
    timestamp: Date.now()
  });

  input.value = '';
  setTypingState(false);
};

window.addEventListener('beforeunload', () => {
  setTypingState(false);
});

fileInput.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (file.size > 150 * 1024) {
    alert('File too large. Please choose a file under 150 KB for Realtime DB storage.');
    fileInput.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    const fileDataURL = reader.result;
    try {
      await db.ref('messages').push({
        name: username,
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileDataURL: fileDataURL,
        timestamp: Date.now()
      });
      fileInput.value = '';
    } catch (error) {
      console.error('File save failed', error);
      alert('File save failed, please try again.');
    }
  };
  reader.onerror = () => {
    console.error('File read failed', reader.error);
    alert('Unable to read file.');
  };

  reader.readAsDataURL(file);
});

function setTypingState(active) {
  if (!username) return;
  const userTypingRef = typingRef.child(username);
  if (active) {
    userTypingRef.set(true);
    if (typingTimeout) clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => userTypingRef.remove().catch(() => {}), TYPING_TIMEOUT);
  } else {
    if (typingTimeout) {
      clearTimeout(typingTimeout);
      typingTimeout = null;
    }
    userTypingRef.remove().catch(() => {});
  }
}

input.addEventListener('input', () => {
  setTypingState(true);
});

input.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendBtn.click();
});

typingRef.on('value', snapshot => {
  const typingUsers = [];
  snapshot.forEach(child => {
    if (child.key !== username) typingUsers.push(child.key);
  });

  if (typingUsers.length === 0) {
    typingIndicator.textContent = '';
  } else if (typingUsers.length === 1) {
    typingIndicator.textContent = `${typingUsers[0]} is typing...`;
  } else {
    typingIndicator.textContent = `${typingUsers.join(', ')} are typing...`;
  }
});

db.ref('messages').on('child_added', snapshot => {
  const msg = snapshot.val();
  addMessage(msg.text, msg.name, msg.timestamp || Date.now(), msg.name === username, msg.fileDataURL, msg.fileName, msg.fileType);
});
</script>

</body>
</html>
