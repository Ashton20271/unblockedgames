<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Compass</title>
  <script src="https://cdn.jsdelivr.net/npm/emoji-js@3.6.0/lib/emoji.min.js"></script>
  <link rel="icon" href="https://greekschoolmentone-vic.compass.education/Assets/Pix/favicon_v11855.png">
  <style>
    body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; background: #000; color: #00ff00; }

    #chat-container {
      width: 90vw;
      height: 80vh;
      border: 2px solid #00ff00;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 5px 0;
      padding: 5px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 1em;
    }

    .me {
      color: #ffff00;
      align-self: flex-end;
      text-align: right;
    }

    .other {
      color: #00ff00;
      align-self: flex-start;
      text-align: left;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #00ff00;
      position: relative;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
    }

    #send {
      padding: 10px;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    .emoji-suggestions {
      display: none;
      position: absolute;
      left: 52px;
      right: 72px;
      bottom: calc(100% + 6px);
      max-height: 190px;
      overflow-y: auto;
      border: 1px solid #00ff00;
      background: #000;
      z-index: 25;
      box-shadow: 0 0 12px rgba(0, 255, 0, 0.15);
    }

    .emoji-suggestions.open {
      display: block;
    }

    .emoji-suggestion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-bottom: 1px solid rgba(0, 255, 0, 0.2);
      background: #000;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      text-align: left;
    }

    .emoji-suggestion:last-child {
      border-bottom: none;
    }

    .emoji-suggestion:hover,
    .emoji-suggestion.active {
      background: rgba(0, 255, 0, 0.12);
    }

    .emoji-suggestion-code {
      opacity: 0.9;
    }

    .emoji-suggestion-icon {
      font-size: 1.1em;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #000;
      padding: 20px;
      border: 2px solid #00ff00;
      width: 300px;
      text-align: center;
      color: #00ff00;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
    }

    .timestamp {
      font-size: 0.8em;
      opacity: 0.8;
    }

    .message-clickable {
      cursor: pointer;
      transition: background 0.2s;
    }

    .message-clickable:hover {
      background: rgba(0, 255, 0, 0.1);
    }

    .message.selected-reply {
      background: rgba(255, 255, 0, 0.2);
      border-left: 3px solid #ffff00;
      padding-left: 7px;
    }

    .reply-to {
      background: rgba(0, 255, 0, 0.1);
      border-left: 2px solid #00ff00;
      padding: 5px;
      margin: 5px 0;
      font-size: 0.9em;
      color: #00ff00;
      cursor: pointer;
    }

    .reply-to:hover {
      background: rgba(0, 255, 0, 0.2);
    }

    .reply-indicator {
      background: #000;
      border: 1px solid #ffff00;
      padding: 8px;
      margin-bottom: 10px;
      color: #ffff00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reply-indicator button {
      background: #000;
      color: #ffff00;
      border: 1px solid #ffff00;
      cursor: pointer;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
    }

    .message-reply-btn,
    .message-react-btn,
    .message-delete-btn {
      opacity: 0;
      background: #000;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      transition: opacity 0.2s, background 0.2s;
      white-space: nowrap;
    }

    .message-reply-btn,
    .message-react-btn {
      color: #00ff00;
      border: 1px solid #00ff00;
    }

    .message-delete-btn {
      color: #ff4444;
      border: 1px solid #ff4444;
    }

    .message-clickable:hover .message-reply-btn,
    .message-clickable:hover .message-react-btn,
    .message-clickable:hover .message-delete-btn {
      opacity: 1;
    }

    .poll {
      border: 2px solid #000;
      padding: 10px;
      margin: 5px 0;
      background: #00ff00;
      color: #000;
      font-weight: bold;
    }

    .poll-question {
      font-weight: bold;
      margin-bottom: 10px;
      color: #000;
    }

    .poll-option {
      display: block;
      margin: 5px 0;
      padding: 5px;
      background: #ffffff;
      border: 1px solid #000;
      color: #000;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .poll-option:disabled {
      background: #666666;
      color: #cccccc;
      cursor: not-allowed;
    }

    .poll-results {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .reaction-picker {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .reaction-picker.open {
      display: flex;
    }

    .reaction-option,
    .reaction-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border: 1px solid #00ff00;
      border-radius: 999px;
      background: rgba(0, 255, 0, 0.08);
      color: #00ff00;
      font-size: 0.85em;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      appearance: none;
    }

    .reaction-option:hover,
    .reaction-chip:hover,
    .message-react-btn:hover {
      background: rgba(0, 255, 0, 0.12);
    }
  </style>

  <style>
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      #chat-container {
        width: 100vw;
        height: 85vh;
      }

      #chat-box {
        padding: 5px;
      }

      .message {
        font-size: 0.9em;
        max-width: 90%;
      }

      #input-area {
        flex-wrap: wrap;
      }

      #input {
        flex: 1;
        min-width: 200px;
        padding: 8px;
      }

      .emoji-suggestions {
        left: 8px;
        right: 8px;
      }

      #send {
        padding: 8px 12px;
        margin-top: 5px;
      }

      #file-btn {
        padding: 8px;
        margin-right: 5px;
        margin-top: 5px;
      }

      .modal-content {
        width: 90%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .message {
        font-size: 0.85em;

      #input {

</head>
<body>

<div id="chat-container">
  <div id="typing-indicator" style="min-height: 1.2em; padding: 6px; color: #00ff00; font-size: 0.9em; opacity: 0.85;"></div>
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="file-input" type="file" style="display: none;" />
    <button id="file-btn" style="margin-right:8px; padding: 10px; border: 1px solid #00ff00; background: #000; color: #00ff00; cursor: pointer; font-family: 'Courier New', monospace;">+</button>
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <div id="emoji-suggestions" class="emoji-suggestions" role="listbox" aria-label="Emoji suggestions"></div>
    <button id="send">Send</button>
  </div>
</div>

<div id="username-modal" class="modal">
  <div class="modal-content">
    <h3>Enter your username</h3>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="submit-btn" id="submit-username">Submit</button>
    <button class="cancel-btn" id="cancel-username">Cancel</button>
  </div>
</div>

<div id="plus-modal" class="modal">
  <div class="modal-content">
    <h3>Choose an action</h3>
    <button id="create-poll-btn" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Create Poll</button>
    <button id="upload-file-btn" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Upload File</button>
    <button id="cancel-plus" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Cancel</button>
  </div>
</div>

<div id="poll-modal" class="modal">
  <div class="modal-content">
    <h3>Create a Poll</h3>
    <input type="text" id="poll-question" placeholder="Poll question" style="width:100%; padding:10px; margin:10px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    <div id="poll-options">
      <input type="text" class="poll-option-input" placeholder="Option 1" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
      <input type="text" class="poll-option-input" placeholder="Option 2" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    </div>
    <button id="add-option-btn" style="margin:10px 0; padding:5px 10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Add Option</button>
    <button id="submit-poll" style="margin:10px 0; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Create Poll</button>
    <button id="cancel-poll" style="margin:10px 0; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Cancel</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://chat-860a5-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('messages');
const MESSAGES_PAGE_SIZE = 50;
const recentMessagesRef = messagesRef.orderByChild('timestamp').limitToLast(MESSAGES_PAGE_SIZE);
const MAX_FILE_SIZE_MB = 5;
const MAX_FILE_SIZE_BYTES = MAX_FILE_SIZE_MB * 1024 * 1024;

let oldestLoadedTimestamp = null;
let isLoadingOlderMessages = false;
let hasLoadedAllOlderMessages = false;

const BLACKLISTED_NAMES = ['Millen', 'Asht0n', 'Millen Jones', 'Ashton Marshall', 'Millen_Jones', 'Ashton_Marshall', 'MillenJones', 'AshtonMarshall', 'Millen jones', 'millen jones', 'millen Jones', 'millen-jones', 'Millen-Jones', 'ashton marshall', 'ashton-marshall', 'm1ll#n', 'mill#n', 'millen.jones', 'm1llen', 'm1llen jones', 'm1llen_jones', 'm1llen-jones', 'm1llenJones', 'm1ll3n', 'm1ll3n jones', 'm1ll3n_jones', 'm1ll3n-jones', 'm1ll3nJones', '4sht0n', '4sht0n marshall', '4sht0n_marshall', '4sht0n-marshall', '4sht0nMarshall', '4sht0n mar5hall', '4sht0n_mar5hall', '4sht0n-mar5hall', '4sht0nMar5hall', ]; 
const typingIndicator = document.getElementById('typing-indicator');
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('input');
const emojiSuggestionsEl = document.getElementById('emoji-suggestions');
const fileInput = document.getElementById('file-input');
const sendBtn = document.getElementById('send');
const fileBtn = document.getElementById('file-btn');
const plusModal = document.getElementById('plus-modal');
const pollModal = document.getElementById('poll-modal');
const createPollBtn = document.getElementById('create-poll-btn');
const uploadFileBtn = document.getElementById('upload-file-btn');
const cancelPlus = document.getElementById('cancel-plus');
const pollQuestion = document.getElementById('poll-question');
const pollOptions = document.getElementById('poll-options');
const addOptionBtn = document.getElementById('add-option-btn');
const submitPoll = document.getElementById('submit-poll');
const cancelPoll = document.getElementById('cancel-poll');

const typingRef = db.ref('typing');
let typingTimeout = null;
const TYPING_TIMEOUT = 2000;

let replyingToMessage = null;
let messageMap = {};
let messageIdMap = {};
const QUICK_REACTIONS = ['👍', '❤️', '😭', '💔', '🥀', '👎'];
const emoji = new EmojiConvertor();
emoji.replace_mode = 'unified';
emoji.allow_native = true;

function replaceEmojiShortcodes(text) {
  if (!text) return '';
  return emoji.replace_colons(text);
}
function autoReplaceWords(text) {
  return text
    .replace(/\bfire\b/gi, '🔥')
    .replace(/\bheart\b/gi, '❤️')
    .replace(/\bskull\b/gi, '💀')
    .replace(/\bcry\b/gi, '😭');
}

const EMOJI_AUTOCOMPLETE = [
  { shortcode: 'sob', emoji: '😭', keywords: ['cry', 'sad', 'tears'] },
  { shortcode: 'pray', emoji: '🙏', keywords: ['please', 'thanks', 'hope'] },
  { shortcode: 'heart', emoji: '❤️', keywords: ['love'] },
  { shortcode: 'fire', emoji: '🔥', keywords: ['lit', 'hot'] },
  { shortcode: 'skull', emoji: '💀', keywords: ['dead', 'lol'] },
  { shortcode: 'joy', emoji: '😂', keywords: ['laugh', 'funny'] },
  { shortcode: 'smile', emoji: '😄', keywords: ['happy'] },
  { shortcode: 'pleading_face', emoji: '🥺', keywords: ['please', 'beg'] },
  { shortcode: 'broken_heart', emoji: '💔', keywords: ['sad', 'hurt'] },
  { shortcode: 'wilted_flower', emoji: '🥀', keywords: ['flower', 'sad'] },
  { shortcode: 'thumbsup', emoji: '👍', keywords: ['ok', 'yes'] },
  { shortcode: 'thumbsdown', emoji: '👎', keywords: ['no', 'bad'] },
  { shortcode: 'eyes', emoji: '👀', keywords: ['look', 'watching'] },
];

let emojiSuggestionMatches = [];
let selectedEmojiSuggestionIndex = -1;

function getEmojiAutocompleteMatch(value) {
  const caretPosition = input.selectionStart ?? value.length;
  const textBeforeCaret = value.slice(0, caretPosition);
  const match = textBeforeCaret.match(/(^|\s):([a-z0-9_+-]*)$/i);

  if (!match) {
    return null;
  }

  return {
    query: match[2].toLowerCase(),
    start: textBeforeCaret.lastIndexOf(':'),
    end: caretPosition
  };
}

function hideEmojiSuggestions() {
  emojiSuggestionsEl.classList.remove('open');
  emojiSuggestionsEl.innerHTML = '';
  emojiSuggestionMatches = [];
  selectedEmojiSuggestionIndex = -1;
}

function renderEmojiSuggestions() {
  if (!emojiSuggestionMatches.length) {
    hideEmojiSuggestions();
    return;
  }

  emojiSuggestionsEl.innerHTML = emojiSuggestionMatches.map((item, index) => `
    <button class="emoji-suggestion${index === selectedEmojiSuggestionIndex ? ' active' : ''}" type="button" role="option" data-index="${index}" aria-selected="${index === selectedEmojiSuggestionIndex}">
      <span class="emoji-suggestion-code">:${escapeHtml(item.shortcode)}:</span>
      <span class="emoji-suggestion-icon">${escapeHtml(item.emoji)}</span>
    </button>
  `).join('');
  emojiSuggestionsEl.classList.add('open');
}

function updateEmojiSuggestions() {
  const match = getEmojiAutocompleteMatch(input.value);

  if (!match) {
    hideEmojiSuggestions();
    return;
  }

  emojiSuggestionMatches = EMOJI_AUTOCOMPLETE
    .filter(item => {
      if (!match.query) return true;
      return item.shortcode.includes(match.query) || item.keywords.some(keyword => keyword.includes(match.query));
    })
    .sort((a, b) => {
      const aRank = a.shortcode.startsWith(match.query) ? 0 : 1;
      const bRank = b.shortcode.startsWith(match.query) ? 0 : 1;
      return aRank - bRank || a.shortcode.localeCompare(b.shortcode);
    })
    .slice(0, 6);

  selectedEmojiSuggestionIndex = emojiSuggestionMatches.length ? 0 : -1;
  renderEmojiSuggestions();
}

function applyEmojiSuggestion(index) {
  const suggestion = emojiSuggestionMatches[index];
  const match = getEmojiAutocompleteMatch(input.value);

  if (!suggestion || !match) {
    return false;
  }

  const before = input.value.slice(0, match.start);
  const after = input.value.slice(match.end);
  const spacer = after && !after.startsWith(' ') ? ' ' : '';

  input.value = `${before}${suggestion.emoji}${spacer}${after}`;

  const nextCursorPosition = before.length + suggestion.emoji.length + spacer.length;
  input.focus();
  input.setSelectionRange(nextCursorPosition, nextCursorPosition);
  hideEmojiSuggestions();
  setTypingState(Boolean(input.value.trim()));
  return true;
}

function getMessageTimestamp(message) {
  const timestamp = Number(message?.timestamp || 0);
  return Number.isFinite(timestamp) ? timestamp : 0;
}

function cacheMessage(messageId, msg) {
  const previewText = msg?.q
    ? '(poll)'
    : (msg?.text ? replaceEmojiShortcodes(msg.text) : (msg?.fileDataURL ? '(file)' : ''));

  messageMap[messageId] = {
    name: msg?.name || 'Unknown',
    text: previewText,
    timestamp: getMessageTimestamp(msg)
  };
  messageIdMap[messageId] = messageId;

  const timestamp = getMessageTimestamp(msg);
  if (timestamp && (oldestLoadedTimestamp === null || timestamp < oldestLoadedTimestamp)) {
    oldestLoadedTimestamp = timestamp;
  }
}

function renderMessageSnapshot(snapshot, { prepend = false } = {}) {
  const msg = snapshot.val() || {};
  const messageId = snapshot.key;

  cacheMessage(messageId, msg);

  if (chatBox.querySelector(`[data-message-id="${messageId}"]`)) {
    return false;
  }

  const pollData = msg.q ? { question: msg.q, options: msg.o ? msg.o.split('|') : [], votes: msg.v || {}, voted: msg.voted || {} } : null;
  const reactions = msg.reactions || msg.r || null;
  addMessage(msg.text, msg.name, msg.timestamp || Date.now(), msg.name === username, msg.fileDataURL, msg.fileName, msg.fileType, messageId, msg.replyingToId, pollData, reactions, prepend);
  return true;
}

async function loadOlderMessages() {
  if (isLoadingOlderMessages || hasLoadedAllOlderMessages || oldestLoadedTimestamp === null || oldestLoadedTimestamp <= 0) {
    return;
  }

  isLoadingOlderMessages = true;
  const previousScrollHeight = chatBox.scrollHeight;
  const previousScrollTop = chatBox.scrollTop;

  try {
    const snapshot = await messagesRef
      .orderByChild('timestamp')
      .endAt(oldestLoadedTimestamp - 1)
      .limitToLast(MESSAGES_PAGE_SIZE)
      .once('value');

    const olderSnapshots = [];
    snapshot.forEach(child => {
      olderSnapshots.push(child);
      cacheMessage(child.key, child.val() || {});
    });

    if (!olderSnapshots.length) {
      hasLoadedAllOlderMessages = true;
      return;
    }

    for (let index = olderSnapshots.length - 1; index >= 0; index -= 1) {
      renderMessageSnapshot(olderSnapshots[index], { prepend: true });
    }

    if (olderSnapshots.length < MESSAGES_PAGE_SIZE) {
      hasLoadedAllOlderMessages = true;
    }

    chatBox.scrollTop = chatBox.scrollHeight - previousScrollHeight + previousScrollTop;
  } catch (error) {
    console.error('Failed to load older messages', error);
  } finally {
    isLoadingOlderMessages = false;
  }
}

chatBox.addEventListener('scroll', () => {
  if (chatBox.scrollTop <= 20) {
    loadOlderMessages();
  }
});

fileBtn.addEventListener('click', () => {
  plusModal.style.display = 'flex';
});

createPollBtn.addEventListener('click', () => {
  plusModal.style.display = 'none';
  pollModal.style.display = 'flex';
});

uploadFileBtn.addEventListener('click', () => {
  plusModal.style.display = 'none';
  fileInput.click();
});

cancelPlus.addEventListener('click', () => {
  plusModal.style.display = 'none';
});

addOptionBtn.addEventListener('click', () => {
  const newOption = document.createElement('input');
  newOption.type = 'text';
  newOption.className = 'poll-option-input';
  newOption.placeholder = `Option ${pollOptions.children.length + 1}`;
  newOption.style = "width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;";
  pollOptions.appendChild(newOption);
});

submitPoll.addEventListener('click', async () => {
  const question = pollQuestion.value.trim();
  const options = Array.from(document.querySelectorAll('.poll-option-input')).map(input => input.value.trim()).filter(val => val);
  if (!question || options.length < 2) {
    alert('Please enter a question and at least 2 options.');
    return;
  }
  const pollData = {
    name: username,
    q: question,
    o: options.join('|'),
    v: options.reduce((acc, opt) => { acc[opt] = 0; return acc; }, {}),
    voted: {},
    timestamp: Date.now()
  };
  if (replyingToMessage) {
    pollData.replyingToId = replyingToMessage.id;
  }
  await messagesRef.push(pollData);
  pollQuestion.value = '';
  pollOptions.innerHTML = `
    <input type="text" class="poll-option-input" placeholder="Option 1" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    <input type="text" class="poll-option-input" placeholder="Option 2" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
  `;
  pollModal.style.display = 'none';
  replyingToMessage = null;
  updateReplyIndicator();
});

cancelPoll.addEventListener('click', () => {
  pollModal.style.display = 'none';
});

let username = null;
let isValidName = false;
while (!isValidName) {
  username = prompt('Enter your username for the chat:');
  if (!username || !username.trim()) {
    username = "User" + Math.floor(Math.random() * 1000);
    isValidName = true;
  } else {
    const trimmedName = username.trim();
    const lowerName = trimmedName.toLowerCase();
    if (BLACKLISTED_NAMES.some(banned => banned.toLowerCase() === lowerName)) {
      alert('Error: Get Lost');
    } else {
      username = trimmedName;
      isValidName = true;
    }
  }
}
localStorage.setItem('chatUsername', username);

function formatFileMessage(fileDataURL, fileName, fileType) {
  if (!fileDataURL || !fileName) return '';

  const safeName = fileName.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  if (fileType && fileType.startsWith('image/')) {
    return `<div style="margin-top:4px;"><span>Image: ${safeName}</span><br/><img src="${fileDataURL}" alt="${safeName}" style="max-width:200px;max-height:200px;margin-top:4px;border:1px solid #00ff00;"/></div>`;
  }

  return `<a href="${fileDataURL}" download="${safeName}">Download ${safeName}</a>`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getReactionUsers(reactionUsers) {
  if (Array.isArray(reactionUsers)) {
    return reactionUsers.filter(Boolean);
  }

  if (reactionUsers && typeof reactionUsers === 'object') {
    return Object.entries(reactionUsers)
      .filter(([, reacted]) => Boolean(reacted))
      .map(([name]) => name);
  }

  return [];
}

function renderReactionSummary(reactions) {
  if (!reactions || typeof reactions !== 'object') return '';

  const reactionHtml = Object.entries(reactions)
    .map(([emoji, reactionUsers]) => {
      const users = getReactionUsers(reactionUsers);
      const count = users.length || (typeof reactionUsers === 'number' ? reactionUsers : 0);
      if (!count) return '';

      const tooltip = users.length
        ? (users.length === 1 ? `${users[0]} reacted with ${emoji}` : `${users.join(', ')} reacted with ${emoji}`)
        : `${count} reaction${count === 1 ? '' : 's'} with ${emoji}`;

      return `<button class="reaction-chip" type="button" data-emoji="${escapeHtml(emoji)}" title="${escapeHtml(`${tooltip} • Click to toggle`)}" aria-label="${escapeHtml(`${tooltip}. Click to toggle your reaction.`)}">${escapeHtml(emoji)} ${count}</button>`;
    })
    .filter(Boolean)
    .join('');

  return reactionHtml ? `<div class="message-reactions">${reactionHtml}</div>` : '';
}

function buildReactionPicker() {
  const options = QUICK_REACTIONS
    .map(emoji => `<button class="reaction-option" type="button" data-emoji="${escapeHtml(emoji)}" aria-label="React with ${escapeHtml(emoji)}">${escapeHtml(emoji)}</button>`)
    .join('');

  return `<div class="reaction-picker">${options}<button class="reaction-option" type="button" data-custom-reaction="true" aria-label="Add custom reaction">+</button></div>`;
}

function closeAllReactionPickers(exceptPicker = null) {
  document.querySelectorAll('.reaction-picker.open').forEach(picker => {
    if (picker !== exceptPicker) {
      picker.classList.remove('open');
    }
  });
}

function toggleReaction(messageId, emoji) {
  const normalizedEmoji = String(emoji ?? '').trim();
  if (!normalizedEmoji || !username) return;

  const messageRef = db.ref('messages').child(messageId);
  messageRef.transaction(currentMessage => {
    if (!currentMessage || typeof currentMessage !== 'object') {
      return currentMessage;
    }

    const nextMessage = { ...currentMessage };
    const nextReactions = nextMessage.reactions && typeof nextMessage.reactions === 'object'
      ? { ...nextMessage.reactions }
      : (nextMessage.r && typeof nextMessage.r === 'object' ? { ...nextMessage.r } : {});

    const currentUsers = new Set(getReactionUsers(nextReactions[normalizedEmoji]));

    if (currentUsers.has(username)) {
      currentUsers.delete(username);
    } else {
      currentUsers.add(username);
    }

    if (currentUsers.size === 0) {
      delete nextReactions[normalizedEmoji];
    } else {
      nextReactions[normalizedEmoji] = {};
      currentUsers.forEach(name => {
        nextReactions[normalizedEmoji][name] = true;
      });
    }

    if (Object.keys(nextReactions).length > 0) {
      nextMessage.reactions = nextReactions;
    } else {
      delete nextMessage.reactions;
    }

    if ('r' in nextMessage) {
      delete nextMessage.r;
    }

    return nextMessage;
  }, error => {
    if (error) {
      console.error('Reaction update failed', error);
      alert('Failed to update reaction.');
    }
  });
}

function addMessage(text, sender, timestamp, isMe, fileDataURL, fileName, fileType, messageId, replyingToId, pollData, reactions, prepend = false) {
  const msg = document.createElement('div');
  msg.classList.add('message', isMe ? 'me' : 'other', 'message-clickable');
  msg.dataset.messageId = messageId;
  const timeStr = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
  const renderedText = replaceEmojiShortcodes(text ?? '');

  let html = '';
  
  if (replyingToId && messageMap[replyingToId]) {
    const repliedTo = messageMap[replyingToId];
    const repliedText = repliedTo.text ? repliedTo.text.substring(0, 50) : '(file)';
    html += `<div class="reply-to" data-message-id="${replyingToId}">↳ Replying to ${repliedTo.name}: ${repliedText}${repliedTo.text && repliedTo.text.length > 50 ? '...' : ''}</div>`;
  }

  html += `<span class="timestamp">[${timeStr}]</span> ${sender}:`;

  if (pollData) {
    const escapedQuestion = pollData.question.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html += `<div class="poll">
      <div class="poll-question">${escapedQuestion}</div>`;
    const hasVoted = pollData.voted[username];
    pollData.options.forEach(option => {
      const voteCount = pollData.votes[option] || 0;
      const escapedOption = option.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const disabled = hasVoted ? 'disabled' : '';
      html += `<button class="poll-option" data-option="${option.replace(/"/g, '&quot;').replace(/`/g, '&#96;')}" ${disabled}>${escapedOption} (${voteCount} votes)</button>`;
    });
    html += `</div>`;
  } else {
    if (renderedText && renderedText.trim()) {
      const safeText = renderedText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const urlRegex = /((https?:\/\/)[\w\-\._~:\/?#\[\]@!$&'()*+,;=%]+)/gi;
      const linkifiedText = safeText.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      html += ` ${linkifiedText}`;
    }

    if (fileDataURL) {
      html += ` ${formatFileMessage(fileDataURL, fileName, fileType)}`;
    }
  }

  html += `<button class="message-reply-btn" type="button">Reply</button>`;
  html += `<button class="message-react-btn" type="button">React</button>`;
  
  if (isMe) {
    html += `<button class="message-delete-btn" type="button">Delete</button>`;
  }

  html += buildReactionPicker();
  html += renderReactionSummary(reactions);

  msg.innerHTML = html;
  
  messageIdMap[messageId] = messageId;
  
  if (pollData) {
    if (!pollData.voted[username]) {
      msg.querySelectorAll('.poll-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const option = e.target.dataset.option;
          votePoll(messageId, option);
        });
      });
    }
  }
  
  msg.addEventListener('click', (e) => {
    if (e.target.classList.contains('reply-to')) {
      const originalMessageId = e.target.dataset.messageId;
      jumpToMessage(originalMessageId);
      return;
    }
    if (e.target.classList.contains('message-reply-btn')) {
      const replyText = pollData ? '(poll)' : (renderedText || '(file)');
      setReplyingTo(messageId, sender, replyText);
      return;
    }
    if (e.target.classList.contains('message-react-btn')) {
      e.stopPropagation();
      const picker = msg.querySelector('.reaction-picker');
      if (picker) {
        const isOpening = !picker.classList.contains('open');
        closeAllReactionPickers(isOpening ? picker : null);
        picker.classList.toggle('open', isOpening);
      }
      return;
    }
    if (e.target.classList.contains('reaction-option') || e.target.classList.contains('reaction-chip')) {
      e.stopPropagation();
      const emoji = e.target.dataset.customReaction === 'true'
        ? prompt('Choose a reaction emoji:', '👍')
        : e.target.dataset.emoji;

      if (emoji !== null) {
        toggleReaction(messageId, replaceEmojiShortcodes(emoji));
      }

      closeAllReactionPickers();
      return;
    }
    if (e.target.classList.contains('message-delete-btn')) {
      deleteMessage(messageId, msg);
      return;
    }
  });

  if (prepend) {
    chatBox.insertBefore(msg, chatBox.firstChild);
    return;
  }

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.reaction-picker') && !e.target.closest('.message-react-btn')) {
    closeAllReactionPickers();
  }

  if (!e.target.closest('#emoji-suggestions') && e.target !== input) {
    hideEmojiSuggestions();
  }
});

emojiSuggestionsEl.addEventListener('mousedown', (e) => {
  const suggestionButton = e.target.closest('.emoji-suggestion');
  if (!suggestionButton) return;

  e.preventDefault();
  applyEmojiSuggestion(Number(suggestionButton.dataset.index));
});

sendBtn.onclick = async () => {
const text = autoReplaceWords(replaceEmojiShortcodes(input.value)).trim();
  if (!text) {
    setTypingState(false);
    return;
  }

  const messageData = {
    name: username,
    text: text,
    timestamp: Date.now()
  };

  if (replyingToMessage) {
    messageData.replyingToId = replyingToMessage.id;
  }

  await messagesRef.push(messageData);

  input.value = '';
  replyingToMessage = null;
  updateReplyIndicator();
  setTypingState(false);
};

window.addEventListener('beforeunload', () => {
  setTypingState(false);
});

function setReplyingTo(messageId, sender, text) {
  replyingToMessage = { id: messageId, sender, text };
  updateReplyIndicator();
  input.focus();
}

function clearReply() {
  replyingToMessage = null;
  updateReplyIndicator();
}

function votePoll(messageId, option) {
  const messageRef = messagesRef.child(messageId);
  messageRef.once('value', snapshot => {
    const msg = snapshot.val();
    if (msg && msg.q && !(msg.voted || {})[username]) {
      msg.voted = msg.voted || {};
      msg.voted[username] = true;
      msg.v[option] = (msg.v[option] || 0) + 1;
      messageRef.update({ v: msg.v, voted: msg.voted });
    }
  });
}

function deleteMessage(messageId, msgElement) {
  messagesRef.child(messageId).remove().catch((error) => {
    console.error('Delete failed', error);
    alert('Failed to delete message');
  });
  
  msgElement.style.opacity = '0';
  msgElement.style.transition = 'opacity 0.3s';
  setTimeout(() => {
    msgElement.remove();
  }, 300);
}

function updateReplyIndicator() {
  let indicator = document.getElementById('reply-indicator');
  
  if (replyingToMessage) {
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.id = 'reply-indicator';
      document.getElementById('input-area').insertBefore(indicator, document.getElementById('input-area').firstChild);
    }
    
    const preview = replyingToMessage.text.substring(0, 50) + (replyingToMessage.text.length > 50 ? '...' : '');
    indicator.innerHTML = `
      <span>↳ Replying to ${replyingToMessage.sender}: ${preview}</span>
      <button type="button">✕</button>
    `;
    indicator.style.display = 'flex';
    indicator.querySelector('button').onclick = clearReply;
  } else {
    if (indicator) {
      indicator.style.display = 'none';
    }
  }
}

fileInput.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (file.size > MAX_FILE_SIZE_BYTES) {
    alert(`File too large. Please choose a file under ${MAX_FILE_SIZE_MB} MB.`);
    fileInput.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    const fileDataURL = reader.result;
    try {
      const fileData = {
        name: username,
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileDataURL: fileDataURL,
        timestamp: Date.now()
      };

      if (replyingToMessage) {
        fileData.replyingToId = replyingToMessage.id;
      }

      await messagesRef.push(fileData);
      fileInput.value = '';
      replyingToMessage = null;
      updateReplyIndicator();
    } catch (error) {
      console.error('File save failed', error);
      alert('File save failed, please try again.');
    }
  };
  reader.onerror = () => {
    console.error('File read failed', reader.error);
    alert('Unable to read file.');
  };

  reader.readAsDataURL(file);
});

function setTypingState(active) {
  if (!username) return;
  const userTypingRef = typingRef.child(username);
  if (active) {
    userTypingRef.set(true);
    if (typingTimeout) clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => userTypingRef.remove().catch(() => {}), TYPING_TIMEOUT);
  } else {
    if (typingTimeout) {
      clearTimeout(typingTimeout);
      typingTimeout = null;
    }
    userTypingRef.remove().catch(() => {});
  }
}

input.addEventListener('input', () => {
  const originalValue = input.value;
  const convertedValue = replaceEmojiShortcodes(originalValue);

  if (convertedValue !== originalValue) {
    const cursorPosition = input.selectionEnd ?? convertedValue.length;
    const delta = convertedValue.length - originalValue.length;
    input.value = convertedValue;
    const nextCursorPosition = Math.max(0, cursorPosition + delta);
    input.setSelectionRange(nextCursorPosition, nextCursorPosition);
  }

  setTypingState(Boolean(input.value.trim()));
  updateEmojiSuggestions();
});

input.addEventListener('keydown', (e) => {
  if (!emojiSuggestionsEl.classList.contains('open') || !emojiSuggestionMatches.length) {
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedEmojiSuggestionIndex = (selectedEmojiSuggestionIndex + 1) % emojiSuggestionMatches.length;
    renderEmojiSuggestions();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedEmojiSuggestionIndex = (selectedEmojiSuggestionIndex - 1 + emojiSuggestionMatches.length) % emojiSuggestionMatches.length;
    renderEmojiSuggestions();
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    applyEmojiSuggestion(selectedEmojiSuggestionIndex >= 0 ? selectedEmojiSuggestionIndex : 0);
  } else if (e.key === 'Escape') {
    hideEmojiSuggestions();
  }
});

input.addEventListener('keypress', function(e) {
  if (e.key === 'Enter' && !emojiSuggestionsEl.classList.contains('open')) sendBtn.click();
});

typingRef.on('value', snapshot => {
  const typingUsers = [];
  snapshot.forEach(child => {
    if (child.key !== username) typingUsers.push(child.key);
  });

  if (typingUsers.length === 0) {
    typingIndicator.textContent = '';
  } else if (typingUsers.length === 1) {
    typingIndicator.textContent = `${typingUsers[0]} is typing...`;
  } else {
    typingIndicator.textContent = `${typingUsers.join(', ')} are typing...`;
  }
});

recentMessagesRef.on('child_added', snapshot => {
  renderMessageSnapshot(snapshot);
});

messagesRef.on('child_changed', snapshot => {
  const msg = snapshot.val();
  const messageId = snapshot.key;
  const messageElement = chatBox.querySelector(`[data-message-id="${messageId}"]`);
  
  if (msg.q) {
    const pollElement = chatBox.querySelector(`[data-message-id="${messageId}"] .poll`);
    if (pollElement) {
      let html = `<div class="poll-question">${msg.q.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
      const options = msg.o ? msg.o.split('|') : [];
      const hasVoted = (msg.voted || {})[username];
      options.forEach(option => {
        const voteCount = msg.v[option] || 0;
        const escapedOption = option.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const disabled = hasVoted ? 'disabled' : '';
        html += `<button class="poll-option" data-option="${option.replace(/"/g, '&quot;').replace(/`/g, '&#96;')}" ${disabled}>${escapedOption} (${voteCount} votes)</button>`;
      });
      pollElement.innerHTML = html;
      if (!hasVoted) {
        pollElement.querySelectorAll('.poll-option').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const option = e.target.dataset.option;
            votePoll(messageId, option);
          });
        });
      }
    }
  }

  if (messageElement) {
    const existingReactionSummary = messageElement.querySelector('.message-reactions');
    if (existingReactionSummary) {
      existingReactionSummary.remove();
    }

    const reactionHtml = renderReactionSummary(msg.reactions || msg.r || null);
    if (reactionHtml) {
      messageElement.insertAdjacentHTML('beforeend', reactionHtml);
    }
  }
});

messagesRef.on('child_removed', snapshot => {
  const messageId = snapshot.key;
  delete messageMap[messageId];
  delete messageIdMap[messageId];

  const messageElement = chatBox.querySelector(`[data-message-id="${messageId}"]`);
  if (messageElement) {
    messageElement.remove();
  }
});
</script>
