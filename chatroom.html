<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Compass</title>
  <link rel="icon" href="https://greekschoolmentone-vic.compass.education/Assets/Pix/favicon_v11855.png">
  <style>
    body { font-family: 'Courier New', monospace; margin: 0; padding: 20px; background: #000; color: #00ff00; }

    #chat-container {
      width: 90vw;
      height: 80vh;
      border: 2px solid #00ff00;
      background: #000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 5px 0;
      padding: 5px;
      max-width: 80%;
      word-wrap: break-word;
      font-size: 1em;
    }

    .me {
      color: #ffff00;
      align-self: flex-end;
      text-align: right;
    }

    .other {
      color: #00ff00;
      align-self: flex-start;
      text-align: left;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #00ff00;
    }

    #input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
    }

    #send {
      padding: 10px;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #000;
      padding: 20px;
      border: 2px solid #00ff00;
      width: 300px;
      text-align: center;
      color: #00ff00;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #00ff00;
      background: #000;
      color: #00ff00;
      font-family: 'Courier New', monospace;
      box-sizing: border-box;
    }

    .timestamp {
      font-size: 0.8em;
      opacity: 0.8;
    }

    .message-clickable {
      cursor: pointer;
      transition: background 0.2s;
    }

    .message-clickable:hover {
      background: rgba(0, 255, 0, 0.1);
    }

    .message.selected-reply {
      background: rgba(255, 255, 0, 0.2);
      border-left: 3px solid #ffff00;
      padding-left: 7px;
    }

    .reply-to {
      background: rgba(0, 255, 0, 0.1);
      border-left: 2px solid #00ff00;
      padding: 5px;
      margin: 5px 0;
      font-size: 0.9em;
      color: #00ff00;
      cursor: pointer;
    }

    .reply-to:hover {
      background: rgba(0, 255, 0, 0.2);
    }

    .reply-indicator {
      background: #000;
      border: 1px solid #ffff00;
      padding: 8px;
      margin-bottom: 10px;
      color: #ffff00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reply-indicator button {
      background: #000;
      color: #ffff00;
      border: 1px solid #ffff00;
      cursor: pointer;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
    }

    .message-reply-btn {
      opacity: 0;
      background: #000;
      color: #00ff00;
      border: 1px solid #00ff00;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .message-clickable:hover .message-reply-btn {
      opacity: 1;
    }

    .message-delete-btn {
      opacity: 0;
      background: #000;
      color: #ff4444;
      border: 1px solid #ff4444;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .message-clickable:hover .message-delete-btn {
      opacity: 1;
    }

    .poll {
      border: 2px solid #000;
      padding: 10px;
      margin: 5px 0;
      background: #00ff00;
      color: #000;
      font-weight: bold;
    }

    .poll-question {
      font-weight: bold;
      margin-bottom: 10px;
      color: #000;
    }

    .poll-option {
      display: block;
      margin: 5px 0;
      padding: 5px;
      background: #ffffff;
      border: 1px solid #000;
      color: #000;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .poll-option:disabled {
      background: #666666;
      color: #cccccc;
      cursor: not-allowed;
    }

    .poll-results {
      margin-top: 10px;
      font-size: 0.9em;
    }

    .reactions-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      margin-bottom: 0;
    }

    .reaction-btn {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 255, 0, 0.15);
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 2px 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .reaction-btn:hover {
      background: rgba(0, 255, 0, 0.3);
      transform: scale(1.05);
    }

    .reaction-btn.active {
      background: rgba(255, 255, 0, 0.25);
      border-color: #ffff00;
      color: #ffff00;
    }

    .reaction-emoji {
      font-size: 1.2em;
    }

    .reaction-count {
      font-size: 0.75em;
      color: inherit;
    }

    .message-reaction-btn {
      opacity: 0;
      background: #000;
      color: #00ff00;
      border: 1px solid #00ff00;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .message-clickable:hover .message-reaction-btn {
      opacity: 1;
    }

    .emoji-picker-modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .emoji-picker-content {
      background-color: #000;
      padding: 15px;
      border: 2px solid #00ff00;
      max-width: 500px;
      width: 90%;
      text-align: center;
      color: #00ff00;
    }

    .emoji-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(35px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .emoji-btn {
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 8px;
      cursor: pointer;
      font-size: 1.5em;
      transition: all 0.2s;
      border-radius: 4px;
    }

    .emoji-btn:hover {
      background: rgba(0, 255, 0, 0.2);
      transform: scale(1.1);
    }
  </style>

  <style>
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      #chat-container {
        width: 100vw;
        height: 85vh;
      }

      #chat-box {
        padding: 5px;
      }

      .message {
        font-size: 0.9em;
        max-width: 90%;
      }

      #input-area {
        flex-wrap: wrap;
      }

      #input {
        flex: 1;
        min-width: 200px;
        padding: 8px;
      }

      #send {
        padding: 8px 12px;
        margin-top: 5px;
      }

      #file-btn {
        padding: 8px;
        margin-right: 5px;
        margin-top: 5px;
      }

      .modal-content {
        width: 90%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      .message {
        font-size: 0.85em;
        max-width: 95%;
      }

      #input {
        min-width: 150px;
      }
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="typing-indicator" style="min-height: 1.2em; padding: 6px; color: #00ff00; font-size: 0.9em; opacity: 0.85;"></div>
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="file-input" type="file" style="display: none;" />
    <button id="file-btn" style="margin-right:8px; padding: 10px; border: 1px solid #00ff00; background: #000; color: #00ff00; cursor: pointer; font-family: 'Courier New', monospace;">+</button>
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="send">Send</button>
  </div>
</div>

<div id="username-modal" class="modal">
  <div class="modal-content">
    <h3>Enter your username</h3>
    <input type="text" id="username-input" placeholder="Your username" />
    <button class="submit-btn" id="submit-username">Submit</button>
    <button class="cancel-btn" id="cancel-username">Cancel</button>
  </div>
</div>

<div id="plus-modal" class="modal">
  <div class="modal-content">
    <h3>Choose an action</h3>
    <button id="create-poll-btn" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Create Poll</button>
    <button id="upload-file-btn" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Upload File</button>
    <button id="cancel-plus" style="display:block; margin:10px auto; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Cancel</button>
  </div>
</div>

<div id="poll-modal" class="modal">
  <div class="modal-content">
    <h3>Create a Poll</h3>
    <input type="text" id="poll-question" placeholder="Poll question" style="width:100%; padding:10px; margin:10px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    <div id="poll-options">
      <input type="text" class="poll-option-input" placeholder="Option 1" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
      <input type="text" class="poll-option-input" placeholder="Option 2" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    </div>
    <button id="add-option-btn" style="margin:10px 0; padding:5px 10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Add Option</button>
    <button id="submit-poll" style="margin:10px 0; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Create Poll</button>
    <button id="cancel-poll" style="margin:10px 0; padding:10px; border:1px solid #00ff00; background:#000; color:#00ff00; cursor:pointer; font-family:'Courier New', monospace;">Cancel</button>
  </div>
</div>

<div id="emoji-picker-modal" class="emoji-picker-modal">
  <div class="emoji-picker-content">
    <h3>React with Emoji</h3>
    <div class="emoji-picker-grid" id="emoji-grid">
      <button class="emoji-btn" data-emoji="👍">👍</button>
      <button class="emoji-btn" data-emoji="❤️">❤️</button>
      <button class="emoji-btn" data-emoji="😂">😂</button>
      <button class="emoji-btn" data-emoji="🔥">🔥</button>
      <button class="emoji-btn" data-emoji="😍">😍</button>
      <button class="emoji-btn" data-emoji="😱">😱</button>
      <button class="emoji-btn" data-emoji="🎉">🎉</button>
      <button class="emoji-btn" data-emoji="😢">😢</button>
      <button class="emoji-btn" data-emoji="🤔">🤔</button>
      <button class="emoji-btn" data-emoji="👏">👏</button>
      <button class="emoji-btn" data-emoji="💯">💯</button>
      <button class="emoji-btn" data-emoji="🤦">🤦</button>
      <button class="emoji-btn" data-emoji="😎">😎</button>
      <button class="emoji-btn" data-emoji="🚀">🚀</button>
      <button class="emoji-btn" data-emoji="💔">💔</button>
      <button class="emoji-btn" data-emoji="👎">👎</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://chat-860a5-default-rtdb.asia-southeast1.firebasedatabase.app/",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const chatBox = document.getElementById('chat-box');
const typingIndicator = document.getElementById('typing-indicator');
const input = document.getElementById('input');
const fileInput = document.getElementById('file-input');
const sendBtn = document.getElementById('send');
const fileBtn = document.getElementById('file-btn');
const plusModal = document.getElementById('plus-modal');
const pollModal = document.getElementById('poll-modal');
const createPollBtn = document.getElementById('create-poll-btn');
const uploadFileBtn = document.getElementById('upload-file-btn');
const cancelPlus = document.getElementById('cancel-plus');
const pollQuestion = document.getElementById('poll-question');
const pollOptions = document.getElementById('poll-options');
const addOptionBtn = document.getElementById('add-option-btn');
const submitPoll = document.getElementById('submit-poll');
const cancelPoll = document.getElementById('cancel-poll');
const emojiPickerModal = document.getElementById('emoji-picker-modal');
const emojiGrid = document.getElementById('emoji-grid');

const typingRef = db.ref('typing');
let typingTimeout = null;
const TYPING_TIMEOUT = 2000;

let replyingToMessage = null;
let messageMap = {};
let messageIdMap = {};
let currentReactionMessageId = null;

fileBtn.addEventListener('click', () => {
  plusModal.style.display = 'flex';
});

createPollBtn.addEventListener('click', () => {
  plusModal.style.display = 'none';
  pollModal.style.display = 'flex';
});

uploadFileBtn.addEventListener('click', () => {
  plusModal.style.display = 'none';
  fileInput.click();
});

cancelPlus.addEventListener('click', () => {
  plusModal.style.display = 'none';
});

addOptionBtn.addEventListener('click', () => {
  const newOption = document.createElement('input');
  newOption.type = 'text';
  newOption.className = 'poll-option-input';
  newOption.placeholder = `Option ${pollOptions.children.length + 1}`;
  newOption.style = "width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;";
  pollOptions.appendChild(newOption);
});

submitPoll.addEventListener('click', async () => {
  const question = pollQuestion.value.trim();
  const options = Array.from(document.querySelectorAll('.poll-option-input')).map(input => input.value.trim()).filter(val => val);
  if (!question || options.length < 2) {
    alert('Please enter a question and at least 2 options.');
    return;
  }
  const pollData = {
    name: username,
    q: question,
    o: options.join('|'),
    v: options.reduce((acc, opt) => { acc[opt] = 0; return acc; }, {}),
    voted: {},
    timestamp: Date.now()
  };
  if (replyingToMessage) {
    pollData.replyingToId = replyingToMessage.id;
  }
  await db.ref('messages').push(pollData);
  pollQuestion.value = '';
  pollOptions.innerHTML = `
    <input type="text" class="poll-option-input" placeholder="Option 1" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
    <input type="text" class="poll-option-input" placeholder="Option 2" style="width:100%; padding:10px; margin:5px 0; border:1px solid #00ff00; background:#000; color:#00ff00; font-family:'Courier New', monospace; box-sizing:border-box;" />
  `;
  pollModal.style.display = 'none';
  replyingToMessage = null;
  updateReplyIndicator();
});

cancelPoll.addEventListener('click', () => {
  pollModal.style.display = 'none';
});

emojiGrid.addEventListener('click', (e) => {
  if (e.target.classList.contains('emoji-btn')) {
    const emoji = e.target.dataset.emoji;
    if (currentReactionMessageId) {
      addReaction(currentReactionMessageId, emoji, username);
      emojiPickerModal.style.display = 'none';
      currentReactionMessageId = null;
    }
  }
});

emojiPickerModal.addEventListener('click', (e) => {
  if (e.target === emojiPickerModal) {
    emojiPickerModal.style.display = 'none';
    currentReactionMessageId = null;
  }
});

function openEmojiPicker(messageId) {
  currentReactionMessageId = messageId;
  emojiPickerModal.style.display = 'flex';
}

function addReaction(messageId, emoji, user) {
  const messageRef = db.ref('messages').child(messageId);
  messageRef.once('value', snapshot => {
    const msg = snapshot.val();
    if (msg) {
      const reactions = msg.reactions || {};
      const emojiKey = emoji;
      
      if (!reactions[emojiKey]) {
        reactions[emojiKey] = {};
      }
      
      reactions[emojiKey][user] = true;
      messageRef.update({ reactions: reactions });
    }
  });
}

function toggleReaction(messageId, emoji, user) {
  const messageRef = db.ref('messages').child(messageId);
  messageRef.once('value', snapshot => {
    const msg = snapshot.val();
    if (msg) {
      const reactions = msg.reactions || {};
      const emojiKey = emoji;
      
      if (!reactions[emojiKey]) {
        reactions[emojiKey] = {};
      }
      
      if (reactions[emojiKey][user]) {
        delete reactions[emojiKey][user];
        if (Object.keys(reactions[emojiKey]).length === 0) {
          delete reactions[emojiKey];
        }
      } else {
        reactions[emojiKey][user] = true;
      }
      
      messageRef.update({ reactions: reactions });
    }
  });
}

function updateReactionsDisplay(messageId, reactions) {
  const container = chatBox.querySelector(`.reactions-container[data-message-id="${messageId}"]`);
  if (!container) return;
  
  container.innerHTML = '';
  
  if (!reactions || Object.keys(reactions).length === 0) return;
  
  Object.entries(reactions).forEach(([emoji, users]) => {
    const userList = Object.keys(users);
    if (userList.length > 0) {
      const btn = document.createElement('button');
      btn.className = 'reaction-btn';
      btn.dataset.emoji = emoji;
      
      if (userList.includes(username)) {
        btn.classList.add('active');
      }
      
      btn.innerHTML = `<span class="reaction-emoji">${emoji}</span><span class="reaction-count">${userList.length}</span>`;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleReaction(messageId, emoji, username);
      });
      
      container.appendChild(btn);
    }
  });
}

let username = localStorage.getItem('chatUsername');
if (!username) {
  username = prompt('Enter your username for the chat:');
  if (username && username.trim()) {
    localStorage.setItem('chatUsername', username.trim());
  } else {
    username = "User" + Math.floor(Math.random() * 1000);
  }
}

function formatFileMessage(fileDataURL, fileName, fileType) {
  if (!fileDataURL || !fileName) return '';

  const safeName = fileName.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  if (fileType && fileType.startsWith('image/')) {
    return `<div style="margin-top:4px;"><span>Image: ${safeName}</span><br/><img src="${fileDataURL}" alt="${safeName}" style="max-width:200px;max-height:200px;margin-top:4px;border:1px solid #00ff00;"/></div>`;
  }

  return `<a href="${fileDataURL}" download="${safeName}">Download ${safeName}</a>`;
}

function addMessage(text, sender, timestamp, isMe, fileDataURL, fileName, fileType, messageId, replyingToId, pollData) {
  const msg = document.createElement('div');
  msg.classList.add('message', isMe ? 'me' : 'other', 'message-clickable');
  msg.dataset.messageId = messageId;
  const timeStr = new Date(timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});

  let html = '';
  
  if (replyingToId && messageMap[replyingToId]) {
    const repliedTo = messageMap[replyingToId];
    const repliedText = repliedTo.text ? repliedTo.text.substring(0, 50) : '(file)';
    html += `<div class="reply-to" data-message-id="${replyingToId}">↳ Replying to ${repliedTo.name}: ${repliedText}${repliedTo.text && repliedTo.text.length > 50 ? '...' : ''}</div>`;
  }

  html += `<span class="timestamp">[${timeStr}]</span> ${sender}:`;

  if (pollData) {
    const escapedQuestion = pollData.question.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    html += `<div class="poll">
      <div class="poll-question">${escapedQuestion}</div>`;
    const hasVoted = pollData.voted[username];
    pollData.options.forEach(option => {
      const voteCount = pollData.votes[option] || 0;
      const escapedOption = option.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const disabled = hasVoted ? 'disabled' : '';
      html += `<button class="poll-option" data-option="${option.replace(/"/g, '&quot;').replace(/`/g, '&#96;')}" ${disabled}>${escapedOption} (${voteCount} votes)</button>`;
    });
    html += `</div>`;
  } else {
    if (text && text.trim()) {
      const safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const urlRegex = /((https?:\/\/)[\w\-\._~:\/?#\[\]@!$&'()*+,;=%]+)/gi;
      const linkifiedText = safeText.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      html += ` ${linkifiedText}`;
    }

    if (fileDataURL) {
      html += ` ${formatFileMessage(fileDataURL, fileName, fileType)}`;
    }
  }

  html += `<button class="message-reply-btn" type="button">Reply</button>`;
  html += `<button class="message-reaction-btn" type="button">😊</button>`;
  
  if (isMe) {
    html += `<button class="message-delete-btn" type="button">Delete</button>`;
  }

  html += `<div class="reactions-container" data-message-id="${messageId}"></div>`;

  msg.innerHTML = html;
  
  messageIdMap[messageId] = messageId;
  
  if (pollData) {
    if (!pollData.voted[username]) {
      msg.querySelectorAll('.poll-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const option = e.target.dataset.option;
          votePoll(messageId, option);
        });
      });
    }
  }
  
  msg.addEventListener('click', (e) => {
    if (e.target.classList.contains('reply-to')) {
      const originalMessageId = e.target.dataset.messageId;
      jumpToMessage(originalMessageId);
      return;
    }
    if (e.target.classList.contains('message-reply-btn')) {
      const replyText = pollData ? '(poll)' : (text || '(file)');
      setReplyingTo(messageId, sender, replyText);
      return;
    }
    if (e.target.classList.contains('message-delete-btn')) {
      deleteMessage(messageId, msg);
      return;
    }
    if (e.target.classList.contains('message-reaction-btn')) {
      openEmojiPicker(messageId);
      return;
    }
    if (e.target.classList.contains('reaction-btn')) {
      toggleReaction(messageId, e.target.dataset.emoji, username);
      return;
    }
  });

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.onclick = async () => {
  const text = input.value.trim();
  if (!text) {
    setTypingState(false);
    return;
  }

  const messageData = {
    name: username,
    text: text,
    timestamp: Date.now()
  };

  if (replyingToMessage) {
    messageData.replyingToId = replyingToMessage.id;
  }

  await db.ref('messages').push(messageData);

  input.value = '';
  replyingToMessage = null;
  updateReplyIndicator();
  setTypingState(false);
};

window.addEventListener('beforeunload', () => {
  setTypingState(false);
});

function setReplyingTo(messageId, sender, text) {
  replyingToMessage = { id: messageId, sender, text };
  updateReplyIndicator();
  input.focus();
}

function clearReply() {
  replyingToMessage = null;
  updateReplyIndicator();
}

function votePoll(messageId, option) {
  const messageRef = db.ref('messages').child(messageId);
  messageRef.once('value', snapshot => {
    const msg = snapshot.val();
    if (msg && msg.q && !(msg.voted || {})[username]) {
      msg.voted = msg.voted || {};
      msg.voted[username] = true;
      msg.v[option] = (msg.v[option] || 0) + 1;
      messageRef.update({ v: msg.v, voted: msg.voted });
    }
  });
}

function deleteMessage(messageId, msgElement) {
  db.ref('messages').child(messageId).remove().catch((error) => {
    console.error('Delete failed', error);
    alert('Failed to delete message');
  });
  
  msgElement.style.opacity = '0';
  msgElement.style.transition = 'opacity 0.3s';
  setTimeout(() => {
    msgElement.remove();
  }, 300);
}

function updateReplyIndicator() {
  let indicator = document.getElementById('reply-indicator');
  
  if (replyingToMessage) {
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.id = 'reply-indicator';
      document.getElementById('input-area').insertBefore(indicator, document.getElementById('input-area').firstChild);
    }
    
    const preview = replyingToMessage.text.substring(0, 50) + (replyingToMessage.text.length > 50 ? '...' : '');
    indicator.innerHTML = `
      <span>↳ Replying to ${replyingToMessage.sender}: ${preview}</span>
      <button type="button">✕</button>
    `;
    indicator.style.display = 'flex';
    indicator.querySelector('button').onclick = clearReply;
  } else {
    if (indicator) {
      indicator.style.display = 'none';
    }
  }
}

fileInput.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (file.size > 150 * 1024) {
    alert('File too large. Please choose a file under 150 KB for Realtime DB storage.');
    fileInput.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    const fileDataURL = reader.result;
    try {
      const fileData = {
        name: username,
        fileName: file.name,
        fileType: file.type || 'application/octet-stream',
        fileDataURL: fileDataURL,
        timestamp: Date.now()
      };

      if (replyingToMessage) {
        fileData.replyingToId = replyingToMessage.id;
      }

      await db.ref('messages').push(fileData);
      fileInput.value = '';
      replyingToMessage = null;
      updateReplyIndicator();
    } catch (error) {
      console.error('File save failed', error);
      alert('File save failed, please try again.');
    }
  };
  reader.onerror = () => {
    console.error('File read failed', reader.error);
    alert('Unable to read file.');
  };

  reader.readAsDataURL(file);
});

function setTypingState(active) {
  if (!username) return;
  const userTypingRef = typingRef.child(username);
  if (active) {
    userTypingRef.set(true);
    if (typingTimeout) clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => userTypingRef.remove().catch(() => {}), TYPING_TIMEOUT);
  } else {
    if (typingTimeout) {
      clearTimeout(typingTimeout);
      typingTimeout = null;
    }
    userTypingRef.remove().catch(() => {});
  }
}

input.addEventListener('input', () => {
  setTypingState(true);
});

input.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendBtn.click();
});

typingRef.on('value', snapshot => {
  const typingUsers = [];
  snapshot.forEach(child => {
    if (child.key !== username) typingUsers.push(child.key);
  });

  if (typingUsers.length === 0) {
    typingIndicator.textContent = '';
  } else if (typingUsers.length === 1) {
    typingIndicator.textContent = `${typingUsers[0]} is typing...`;
  } else {
    typingIndicator.textContent = `${typingUsers.join(', ')} are typing...`;
  }
});

db.ref('messages').on('child_added', snapshot => {
  const msg = snapshot.val();
  const messageId = snapshot.key;
  
  messageMap[messageId] = {
    name: msg.name,
    text: msg.text,
    timestamp: msg.timestamp
  };
  
  const pollData = msg.q ? { question: msg.q, options: msg.o ? msg.o.split('|') : [], votes: msg.v || {}, voted: msg.voted || {} } : null;
  addMessage(msg.text, msg.name, msg.timestamp || Date.now(), msg.name === username, msg.fileDataURL, msg.fileName, msg.fileType, messageId, msg.replyingToId, pollData);
  
  if (msg.reactions) {
    updateReactionsDisplay(messageId, msg.reactions);
  }
});

db.ref('messages').on('child_changed', snapshot => {
  const msg = snapshot.val();
  const messageId = snapshot.key;
  
  if (msg.q) {
    const pollElement = chatBox.querySelector(`[data-message-id="${messageId}"] .poll`);
    if (pollElement) {
      let html = `<div class="poll-question">${msg.q.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
      const options = msg.o ? msg.o.split('|') : [];
      const hasVoted = (msg.voted || {})[username];
      options.forEach(option => {
        const voteCount = msg.v[option] || 0;
        const escapedOption = option.replace(/`/g, '&#96;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const disabled = hasVoted ? 'disabled' : '';
        html += `<button class="poll-option" data-option="${option.replace(/"/g, '&quot;').replace(/`/g, '&#96;')}" ${disabled}>${escapedOption} (${voteCount} votes)</button>`;
      });
      pollElement.innerHTML = html;
      if (!hasVoted) {
        pollElement.querySelectorAll('.poll-option').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const option = e.target.dataset.option;
            votePoll(messageId, option);
          });
        });
      }
    }
  }
  
  if (msg.reactions) {
    updateReactionsDisplay(messageId, msg.reactions);
  }
});
</script>

</body>
</html>
