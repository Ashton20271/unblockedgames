<!DOCTYPE html>
<html>
<head>
  <title>Chatroom</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; }
  </style>
</head>
<body>

<h2>Global Chat</h2>

<div id="namePrompt">
  <input id="nameInput" placeholder="Enter display name">
  <button onclick="setName()">Join</button>
</div>

<div id="chatUI" style="display:none;">
  <div id="chat"></div>
  <input id="msg" placeholder="Type message" onkeydown="if(event.key==='Enter') send()">
  <button onclick="send()">Send</button>
</div>

<script>
let ws;
let username = "";

function setName() {
  username = document.getElementById("nameInput").value.trim();
  if (!username) return;

  document.getElementById("namePrompt").style.display = "none";
  document.getElementById("chatUI").style.display = "block";

  ws = new WebSocket("ws://" + location.host);

  ws.onmessage = event => {
    const chat = document.getElementById("chat");
    chat.innerHTML += event.data + "<br>";
    chat.scrollTop = chat.scrollHeight;
  };
}

function send() {
  const input = document.getElementById("msg");
  if (input.value.trim() === "") return;

  ws.send(username + ": " + input.value);
  input.value = "";
}
</script>

</body>
</html>
